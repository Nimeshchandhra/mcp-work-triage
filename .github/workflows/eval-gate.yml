name: Evaluation & Cost CI Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  eval-gate:
    name: LLM Quality & Cost Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp[cli]>=1.2.0" "pydantic>=2.0" "httpx>=0.27.0" "pytest>=8.0.0" "pytest-asyncio>=0.23.0"
          pip install -e mcp-work-triage

      - name: Run MCP Server Unit Tests
        run: |
          pytest mcp-work-triage/tests -v

      - name: Run Evaluation Suite Unit Tests
        run: |
          pytest evals/tests -v

      - name: Run Offline Evaluation Suite & Enforce Quality/Cost Gate
        run: |
          python -m evals.run_evals --mode=offline --output evals/reports/latest.json --output-markdown evals/reports/latest.md

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-summary-report
          path: |
            evals/reports/latest.json
            evals/reports/latest.md

      - name: Publish Evaluation Summary to Job Summary
        if: always()
        run: |
          if [ -f evals/reports/latest.md ]; then
            cat evals/reports/latest.md >> $GITHUB_STEP_SUMMARY
          fi
